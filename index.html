<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工時表產生器 Timesheet</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#e2e6ec;--ac:#2f6fed;--acx:#fff;--warn:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1c2028;--tx:#e8ebf0;--mut:#98a2b3;--bd:#2d333f;--ac:#5b8cff;--acx:#0b1020;--warn:#f97066}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1c2028;--tx:#e8ebf0;--mut:#98a2b3;--bd:#2d333f;--ac:#5b8cff;--acx:#0b1020;--warn:#f97066}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>label{flex:1;min-width:150px;font-size:13px;color:var(--mut)}
input,textarea{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
button{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut);text-transform:uppercase}
tfoot td{font-weight:700;border-top:2px solid var(--tx);border-bottom:0}
.warn{color:var(--warn);font-size:13px;margin:8px 0 0}.hint{color:var(--mut);font-size:12.5px;margin-top:6px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>工時表產生器</h1>
<p class="sub">貼上工時文字紀錄 → 自動計算 → 下載 PDF 給主管</p>

<div class="card">
  <div class="row">
    <label>姓名 Name（選填）<input id="name" placeholder="例如 Jane Doe"></label>
    <label>年份 Year<input id="year" type="number" value="2026"></label>
    <label>預設休息（分鐘）<input id="brk" type="number" value="30"></label>
  </div>
  <label style="display:block;margin-top:12px;font-size:13px;color:var(--mut)">工時紀錄
<textarea id="log" spellcheck="false" placeholder="10月6日：11点到17:45
10月8日：10点到17:45 15mins break"></textarea></label>
  <div class="hint">格式：「10月6日：11点到17:45」。休息時間預設 30 分鐘；若該行寫「15mins break」就改用該值（「0 break」代表沒休息）。</div>
  <div id="warns"></div>
</div>

<div class="card">
  <div class="wrap"><table>
    <thead><tr><th>Date</th><th>Start time</th><th>End time</th><th>Gross hours</th><th>Break hours</th><th>Net work hours</th></tr></thead>
    <tbody id="tb"></tbody><tfoot id="tf"></tfoot>
  </table></div>
  <div class="bar"><button id="dl" disabled>下載 PDF</button><span id="msg" class="hint"></span></div>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let rows=[],totals=null;

function parseTime(s){
  s=s.trim();
  let m=s.match(/^(\d{1,2})\s*[:：]\s*(\d{2})$/); if(m)return +m[1]*60+ +m[2];
  m=s.match(/^(\d{1,2})\s*[点點时時]\s*(?:(\d{1,2})\s*分?|半)?$/);
  if(m){ if(/半/.test(s))return +m[1]*60+30; return +m[1]*60+(m[2]?+m[2]:0); }
  return null;
}
const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const hrs=m=>(m/60).toFixed(2);

function calc(){
  const year=+$("year").value||new Date().getFullYear(), defBrk=+$("brk").value;
  const T="(\\d{1,2}\\s*[:：]\\s*\\d{2}|\\d{1,2}\\s*[点點时時](?:\\s*\\d{1,2}\\s*分?|半)?)";
  const re=new RegExp("(\\d{1,2})\\s*月\\s*(\\d{1,2})\\s*[日号號]?\\s*[:：]?\\s*"+T+"\\s*(?:到|至|~|-|–|—)\\s*"+T+"(.*)$");
  rows=[];const warns=[];
  $("log").value.split(/\r?\n/).forEach((line,i)=>{
    if(!line.trim())return;
    const m=line.match(re);
    if(!m){warns.push(`第 ${i+1} 行無法解析喔：${line}`);return;}
    const mo=+m[1],d=+m[2],st=parseTime(m[3]),en=parseTime(m[4]);
    if(st==null||en==null||en<=st){warns.push(`第 ${i+1} 行時間有誤：${line}`);return;}
    let br=defBrk;const rest=m[5]||"";
    const b=rest.match(/(\d+)\s*(?:mins?|minutes?|分鐘|分钟|分)/i);
    if(b)br=+b[1];
    else if(/no\s*break|沒休息|没休息|無休息|无休息/i.test(rest))br=0;
    else {const z=rest.match(/(\d+)\s*break/i); if(z)br=+z[1];}
    const gross=en-st,net=gross-br;
    const dt=new Date(year,mo-1,d);
    rows.push({date:`${DOW[dt.getDay()]}, ${String(d).padStart(2,"0")} ${MON[mo-1]} ${year}`,start:fmt(st),end:fmt(en),gross,br,net});
  });
  totals=rows.reduce((a,r)=>({gross:a.gross+r.gross,br:a.br+r.br,net:a.net+r.net}),{gross:0,br:0,net:0});
  const tb=$("tb");tb.textContent="";
  rows.forEach(r=>{const tr=document.createElement("tr");
    [r.date,r.start,r.end,hrs(r.gross),hrs(r.br),hrs(r.net)].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td);});
    tb.appendChild(tr);});
  const tf=$("tf");tf.textContent="";
  if(rows.length){const tr=document.createElement("tr");
    [`Total (${rows.length} days)`,"","",hrs(totals.gross),hrs(totals.br),hrs(totals.net)].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td);});
    tf.appendChild(tr);}
  const w=$("warns");w.textContent="";
  warns.forEach(t=>{const p=document.createElement("p");p.className="warn";p.textContent=t;w.appendChild(p);});
  $("dl").disabled=!rows.length;
}

async function download(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"a4"});
  const name=$("name").value.trim(), year=+$("year").value;
  const mos=[...new Set(rows.map(r=>r.date.split(" ")[2]))].join(" / ");
  doc.setFontSize(18);doc.setFont("helvetica","bold");doc.text((name?name+" ":"")+"Work Hours Record",40,50);
  doc.setFontSize(11);doc.setFont("helvetica","normal");
  let y=70;
  doc.text("Period: "+mos+" "+year,40,y);
  const f=n=>hrs(n);
  doc.autoTable({
    startY:y+16,
    head:[["Date","Start time","End time","Gross hours","Break hours","Net work hours"]],
    body:rows.map(r=>[r.date,r.start,r.end,f(r.gross),f(r.br),f(r.net)]),
    foot:[[`Total (${rows.length} days)`,"","",f(totals.gross),f(totals.br),f(totals.net)]],
    theme:"grid",showFoot:"lastPage",
    styles:{fontSize:10,cellPadding:5},
    headStyles:{fillColor:[47,111,237],textColor:255},
    footStyles:{fillColor:[235,238,244],textColor:20,fontStyle:"bold"},
    columnStyles:{0:{halign:"left"},1:{halign:"center"},2:{halign:"center"},3:{halign:"right"},4:{halign:"right"},5:{halign:"right"}},
    didParseCell:d=>{if(d.section==="head"&&d.column.index>0)d.cell.styles.halign=d.column.index<3?"center":"right";}
  });
  doc.save(`${name?name.replace(/[\\/:*?"<>|]/g,"")+" ":""}Work Hours Record - ${mos.replace(/ \/ /g,"-")} ${year}.pdf`);
  $("msg").textContent="";
}

["log","year","brk"].forEach(id=>$(id).addEventListener("input",calc));
$("dl").addEventListener("click",download);
calc();
</script>
</body>
</html>
